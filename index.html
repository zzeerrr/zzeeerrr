<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>About Me | Timothy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0d;
            color: #e3e3e3;
        }

        /* HEADER */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e3a8a;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: fadeDown 1s ease forwards;
        }

        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .left-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.2s;
        }

        nav a:hover {
            color: #9cb7ff;
        }

        /* CONTAINER */
        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 40px;
            background: #11131a;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            animation: fadeUp 1s ease forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .about-wrapper {
            display: flex;
            align-items: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        /* FOTO */
        .profile-img {
            width: 300px;
            height: 360px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 0 18px rgba(90,120,255,0.6);
            transition: 0.4s;
        }

        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 28px rgba(90,120,255,0.9);
        }

        /* TEXT */
        h1 {
            color: #6d85ff;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(90,120,255,0.5);
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: #cfd3ff;
            margin-bottom: 18px;
            transition: 0.3s;
        }

        p:hover {
            color: white;
            transform: translateX(6px);
        }

        /* TITLE TIMELINE */
        .timeline-title {
            margin-top: 40px;
            margin-bottom: 40px;
            text-align: center;
            font-size: 1.9rem;
            color: #6d85ff;
            text-shadow: 0 0 12px rgba(90,120,255,0.6);
        }

        /* TIMELINE GARIS BESAR */
        .timeline-wrapper {
            position: relative;
            margin: 40px auto;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #3756ff, #1e3a8a);
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(80,120,255,0.8);
        }

        /* DOT TITIK TIMELINE */
        .timeline-dot {
            width: 24px;
            height: 24px;
            background: #6d85ff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 18px rgba(90,120,255,1);
            border: 3px solid #cfd3ff;
        }

        /* ITEM DI BAWAH TIMELINE */
        .timeline-item {
            text-align: center;
            width: 33%;
            position: relative;
        }

        .timeline-row {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
        }

        .timeline-img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 16px rgba(90,120,255,0.8);
            transition: 0.3s;
        }

        .timeline-img:hover {
            transform: scale(1.1);
        }

        .timeline-item h3 {
            color: #8ea2ff;
            margin-bottom: 5px;
        }

        .timeline-item p {
            color: #d7dbff;
        }

    </style>
</head>

<body>

<header>
    <div class="left-header">
        <img src="Cuplikan_layar_2025-11-21_141248-removebg-preview.png" alt="Logo Timothy">
        <span class="header-title">Timothy</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="Portofolio.html">Portfolio</a>
        <a href="About Me">About me</a>
    </nav>
</header>

<div class="container">

    <div class="about-wrapper">
        <img src="Gambar Timothy.png" alt="Profile" class="profile-img">

        <div class="text-box">
            <h1>Timothy</h1>
            <p>Halo Nama saya adalah Timothy, Saya dari SMA Santa Theresia Jakarta yang punya minat besar di bidang olahraga, terutama futsal.</p>
        </div>
    </div>

    <!-- TITLE -->
    <h2 class="timeline-title">Riwayat Pendidikan</h2>

    <!-- GARIS TIMELINE -->
    <div class="timeline-wrapper">
        <div class="timeline-dot" style="left: 10%;"></div>
        <div class="timeline-dot" style="left: 50%;"></div>
        <div class="timeline-dot" style="left: 90%;"></div>
    </div>

    <!-- ITEM TIMELINE -->
    <div class="timeline-row">

        <div class="timeline-item">
            <img src="SD.jpg" class="timeline-img" alt="SD Tarakanita 1">
            <h3>SD</h3>
            <p>SD Tarakanita 1</p>
        </div>

        <div class="timeline-item">
            <img src="SMP.jpg" class="timeline-img" alt="SMP Tarakanita 5">
            <h3>SMP</h3>
            <p>SMP Tarakanita 5</p>
        </div>

        <div class="timeline-item">
            <img src="SMA.jpg" class="timeline-img" alt="SMA Santa Theresia">
            <h3>SMA</h3>
            <p>SMA Santa Theresia</p>
        </div>

    </div>

</div>

</body>
</html>
